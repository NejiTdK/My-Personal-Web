<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Pixel "A" - 8x8 grid scaled to 16x16 -->
  <!-- Row 1: top of A -->
  <rect x="6" y="0" width="4" height="1" fill="#00E5FF"/>
  <!-- Row 2 -->
  <rect x="5" y="1" width="1" height="1" fill="#00E5FF"/>
  <rect x="10" y="1" width="1" height="1" fill="#00E5FF"/>
  <!-- Row 3 -->
  <rect x="4" y="2" width="1" height="1" fill="#00E5FF"/>
  <rect x="11" y="2" width="1" height="1" fill="#00E5FF"/>
  <!-- Row 4: crossbar start -->
  <rect x="3" y="3" width="1" height="1" fill="#00E5FF"/>
  <rect x="5" y="3" width="6" height="1" fill="#00E5FF"/>
  <rect x="12" y="3" width="1" height="1" fill="#00E5FF"/>
  <!-- Row 5 -->
  <rect x="2" y="4" width="1" height="1" fill="#00E5FF"/>
  <rect x="13" y="4" width="1" height="1" fill="#00E5FF"/>
  <!-- Row 6 -->
  <rect x="2" y="5" width="12" height="1" fill="#00E5FF"/>
  <!-- Row 7 -->
  <rect x="2" y="6" width="1" height="1" fill="#00E5FF"/>
  <rect x="13" y="6" width="1" height="1" fill="#00E5FF"/>
  <!-- Row 8 -->
  <rect x="2" y="7" width="1" height="1" fill="#00E5FF"/>
  <rect x="13" y="7" width="1" height="1" fill="#00E5FF"/>
  <!-- Row 9: legs -->
  <rect x="2" y="8" width="1" height="1" fill="#00E5FF"/>
  <rect x="13" y="8" width="1" height="1" fill="#00E5FF"/>
  <!-- Row 10: feet -->
  <rect x="1" y="9" width="2" height="1" fill="#00E5FF"/>
  <rect x="13" y="9" width="2" height="1" fill="#00E5FF"/>
  <!-- Row 11-14: extend down for 16px height -->
  <rect x="2" y="10" width="1" height="1" fill="#00E5FF"/>
  <rect x="13" y="10" width="1" height="1" fill="#00E5FF"/>
  <rect x="2" y="11" width="1" height="1" fill="#00E5FF"/>
  <rect x="13" y="11" width="1" height="1" fill="#00E5FF"/>
  <rect x="2" y="12" width="1" height="1" fill="#00E5FF"/>
  <rect x="13" y="12" width="1" height="1" fill="#00E5FF"/>
  <rect x="2" y="13" width="1" height="1" fill="#00E5FF"/>
  <rect x="13" y="13" width="1" height="1" fill="#00E5FF"/>
  <!-- Row 14-15: bottom feet extended -->
  <rect x="1" y="14" width="2" height="1" fill="#00E5FF"/>
  <rect x="13" y="14" width="2" height="1" fill="#00E5FF"/>
  <rect x="1" y="15" width="2" height="1" fill="#00E5FF"/>
  <rect x="13" y="15" width="2" height="1" fill="#00E5FF"/>
</svg>