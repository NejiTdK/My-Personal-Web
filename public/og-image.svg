<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fondo negro -->
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Grid pixelado sutil -->
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1" fill="#1a1a1a"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Borde pixelado cyan -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#00E5FF" stroke-width="8"/>
  <rect x="56" y="56" width="1088" height="518" fill="none" stroke="#00E5FF" stroke-width="4"/>
  
  <!-- Logo/Icono pixelado -->
  <g transform="translate(600, 250)" text-anchor="middle">
    <!-- Contenedor pixelado -->
    <rect x="-60" y="-60" width="120" height="120" fill="#0a0a0a" stroke="#00E5FF" stroke-width="4"/>
    <!-- Letra A pixel art style -->
    <rect x="-40" y="-40" width="8" height="80" fill="#00E5FF"/>
    <rect x="-40" y="-40" width="80" height="8" fill="#00E5FF"/>
    <rect x="-40" y="0" width="80" height="8" fill="#FFE500"/>
    <rect x="32" y="-40" width="8" height="80" fill="#00E5FF"/>
    <!-- Centro amarillo -->
    <rect x="-16" y="-16" width="32" height="32" fill="#FFE500"/>
  </g>
  
  <!-- Título -->
  <text x="600" y="380" 
        font-family="'Courier New', monospace" 
        font-size="56" 
        font-weight="bold"
        fill="#00E5FF" 
        text-anchor="middle"
        style="letter-spacing: 8px;">ALECDEV</text>
  
  <!-- Subtítulo -->
  <text x="600" y="440" 
        font-family="'Courier New', monospace" 
        font-size="28" 
        fill="#FFE500" 
        text-anchor="middle">Desarrollador Front-end</text>
  
  <!-- Tech stack -->
  <text x="600" y="500" 
        font-family="'Courier New', monospace" 
        font-size="18" 
        fill="#888888" 
        text-anchor="middle">React • Astro • JavaScript • TypeScript</text>
  
  <!-- Corner decorations -->
  <rect x="60" y="60" width="20" height="20" fill="#00E5FF"/>
  <rect x="1120" y="60" width="20" height="20" fill="#00E5FF"/>
  <rect x="60" y="550" width="20" height="20" fill="#FFE500"/>
  <rect x="1120" y="550" width="20" height="20" fill="#FFE500"/>
</svg>
